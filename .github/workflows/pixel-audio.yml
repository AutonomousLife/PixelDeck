name: Pixel audio 16 KB rebuild
on:
  push:
    branches: [codex/pixel-gpu-probe]
    paths: [.github/workflows/pixel-audio.yml, 'tools/pixel-audio/**', 'tools/aaudio-sink/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies and pinned NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool libtool-bin m4 pkg-config gettext autopoint intltool gperf perl zstd
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          echo "NDK_PATH=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Rebuild and verify the audio stack
        run: bash tools/pixel-audio/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-audio-aarch64
          path: build/pixel-audio/artifact/
          if-no-files-found: error
          retention-days: 14
