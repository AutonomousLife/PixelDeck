name: Pixel vkQuake game experiment
on:
  push:
    branches: [codex/pixel-gpu-probe]
    paths: [.github/workflows/pixel-vkquake.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vkquake:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned ARM64 engine and stage free game data
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v "$PWD:/work" -w /work debian:13 bash -s <<'BUILD'
          set -euxo pipefail
          # Keep compiler/libc older than the runtime instead of using rolling Arch packages.
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git meson ninja-build pkgconf curl \
            libsdl2-dev libvulkan-dev glslang-tools spirv-tools
          # 1.35.0 retains the current Meson shader pipeline without 1.36.0's SDK >=1.4.341 requirement.
          # Debian 13 supplies Vulkan 1.4.309, sufficient for this native game validation.
          source_commit=30c76a7bdbfd9338e40bfe29f0896753b6d0cc9d
          data_url=https://github.com/lavenderdotpet/LibreQuake/releases/download/v0.09-beta/lite.zip
          data_sha=428e736b2f01d953e09a08c60bee975bdc4a0ac2219e97fa095c8af41754da83
          git init vkquake-source
          git -C vkquake-source remote add origin https://github.com/Novum/vkQuake.git
          git -C vkquake-source fetch --depth=1 origin "$source_commit"
          git -C vkquake-source checkout --detach FETCH_HEAD
          test "$(git -C vkquake-source rev-parse HEAD)" = "$source_commit"
          # Debian's SPIRV-Tools 2025.1 lacks --canonicalize-ids. The upstream
          # debugoptimized profile skips that optional pass while keeping C code optimized.
          # WAV game sounds remain enabled; external soundtrack codecs are unnecessary here.
          meson setup vkquake-build vkquake-source --buildtype=debugoptimized \
            -Duse_sdl3=disabled -Duse_codec_mp3=disabled -Duse_codec_flac=disabled \
            -Duse_codec_vorbis=disabled -Duse_codec_opus=disabled
          meson compile -C vkquake-build -j "$(nproc)"
          mkdir pixel-vkquake
          cp vkquake-build/vkquake pixel-vkquake/
          strip --strip-unneeded pixel-vkquake/vkquake
          readelf -h pixel-vkquake/vkquake > pixel-vkquake/ELF_HEADER.txt
          grep -q 'Machine:.*AArch64' pixel-vkquake/ELF_HEADER.txt || { echo 'Expected an AArch64 ELF executable'; exit 3; }
          # Match the existing runtime's SONAME inventory, as the Gamescope build does.
          readelf -d pixel-vkquake/vkquake | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' > pixel-vkquake/NEEDED.txt
          cat pixel-vkquake/NEEDED.txt
          while IFS= read -r lib; do
            grep -qx "$lib" tools/gamescope/runtime-sonames.txt || { echo "Not in runtime: $lib"; exit 3; }
          done < pixel-vkquake/NEEDED.txt
          # This runtime has glibc 2.42; do not ship a newer symbol requirement.
          readelf --version-info pixel-vkquake/vkquake > pixel-vkquake/SYMBOL_VERSIONS.txt
          max_glibc=$(grep -o 'GLIBC_[0-9.]*' pixel-vkquake/SYMBOL_VERSIONS.txt | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "Maximum required glibc: $max_glibc; runtime: 2.42"
          if [ -z "$max_glibc" ] || [ "$(printf '%s\n' "$max_glibc" 2.42 | sort -V | tail -1)" != 2.42 ]; then
            cat pixel-vkquake/SYMBOL_VERSIONS.txt
            echo 'Binary requires unsupported glibc symbols'
            exit 3
          fi
          ldd pixel-vkquake/vkquake | tee pixel-vkquake/BUILD_LDD.txt
          ! grep -q 'not found' pixel-vkquake/BUILD_LDD.txt
          # vkQuake embeds its generated SPIR-V and engine pak in this binary.
          cp vkquake-source/LICENSE.txt pixel-vkquake/VKQUAKE-LICENSE.txt
          git -C vkquake-source archive --format=tar.gz HEAD > pixel-vkquake/vkquake-source.tar.gz
          printf '%s\n' "$source_commit" > pixel-vkquake/SOURCE_COMMIT
          dpkg-query -W > pixel-vkquake/BUILD_PACKAGES.txt
          curl --fail --location --retry 3 "$data_url" -o pixel-vkquake/lite.zip
          printf '%s  %s\n' "$data_sha" pixel-vkquake/lite.zip | sha256sum -c -
          cat > pixel-vkquake/README.txt <<'README'
          PixelDeck validation artifact only. Nothing is bundled into the APK.
          Engine: https://github.com/Novum/vkQuake
          vkQuake 1.35.0 commit 30c76a7bdbfd9338e40bfe29f0896753b6d0cc9d, unmodified.
          Validation pin: 1.35.0 builds with Debian 13's Vulkan 1.4.309 SDK;
          1.36.0 requires SDK >=1.4.341. The compiler/libc come entirely from Debian 13.
          Upstream debugoptimized build: optimized C code, debug shaders, no optional
          --canonicalize-ids pass (unavailable in Debian's SPIRV-Tools 2025.1).
          Use this artifact for rendering validation; performance differs from a release build.
          Generated SPIR-V and engine pak are embedded in vkquake. Full engine source is included.
          Data: https://github.com/lavenderdotpet/LibreQuake/releases/tag/v0.09-beta
          lite.zip SHA256 428e736b2f01d953e09a08c60bee975bdc4a0ac2219e97fa095c8af41754da83
          LibreQuake licenses/credits are inside lite/id1/docs; preserve that directory.

          After checking SHA256SUMS, extract lite.zip, then move lite/id1 beside vkquake.
          In the existing PixelDeck Linux runtime, start through the usual run session:
            /root/pixel-vkquake/vkquake -basedir /root/pixel-vkquake -width 1280 -height 720 -window +vid_fsaa 1 +vid_vsync 0 +timedemo demo1
          Run through Gamescope with the selected PanVK ICD. This demo needs no sign-in or input.
          A timedemo prints engine FPS; also inspect the Android compositor and screenshot.
          To save a GPU-rendered PNG while the demo runs without any UI input, create
          id1/pixeldeck-capture.cfg containing 120 separate lines of "wait", then
          one line "screenshot png", and append +exec pixeldeck-capture.cfg to the launch.
          The screenshot is saved under id1 with an automatic vkQuake*.png filename.
          This is a native Linux Vulkan game test, not a Proton/Windows compatibility test.
          External MP3/FLAC/Vorbis/Opus music codecs are disabled; WAV effects remain enabled.
          Runtime SONAME and glibc symbol checks establish loader compatibility only;
          the real device test must still verify Vulkan rendering and presentation.
          README
          (cd pixel-vkquake && sha256sum vkquake lite.zip vkquake-source.tar.gz > SHA256SUMS)
          BUILD
          sudo chown -R "$(id -u):$(id -g)" pixel-vkquake
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-vkquake-aarch64
          path: pixel-vkquake/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-vkquake-build-diagnostics
          path: |
            vkquake-build/meson-logs/
            pixel-vkquake/ELF_HEADER.txt
            pixel-vkquake/NEEDED.txt
            pixel-vkquake/SYMBOL_VERSIONS.txt
            pixel-vkquake/BUILD_LDD.txt
          if-no-files-found: ignore
          retention-days: 7
